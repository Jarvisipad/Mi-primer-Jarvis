<!doctype html>

<html lang="es">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#050b18">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="JARVIS">

<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icon.svg" type="image/svg+xml">

<title>JARVIS | Centro de control</title>

<style>

:root{color-scheme:dark;--bg:#050b18;--panel:rgba(7,24,48,.78);--line:rgba(56,190,255,.32);--cyan:#5bdcff;--blue:#168bff;--muted:#8aaec8;--white:#eaf8ff;--glow:0 0 22px rgba(40,180,255,.24)}

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#10345c 0,#07152a 38%,#030813 78%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}

body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(69,185,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(69,185,255,.12) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 90%)}

header{padding:calc(env(safe-area-inset-top) + 18px) 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}

.brand{letter-spacing:.28em;font-weight:800;font-size:20px;color:#c9f4ff;text-shadow:0 0 16px #168bff}.sub{font-size:9px;letter-spacing:.22em;color:var(--muted);margin-top:4px}

.status{font-size:10px;letter-spacing:.12em;color:#7ef5c2;border:1px solid rgba(126,245,194,.3);padding:7px 10px;border-radius:30px;background:#09251f}

main{max-width:1100px;margin:auto;padding:8px 16px 36px;position:relative}.hero{text-align:center;padding:16px 8px 20px}

.eyebrow{font-size:10px;letter-spacing:.28em;color:var(--cyan)}h1{font-size:clamp(26px,5vw,42px);letter-spacing:.12em;margin:8px 0 4px;font-weight:500}.tagline{color:var(--muted);font-size:12px}

.core-wrap{display:flex;justify-content:center;margin:18px auto 14px}.core{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;position:relative;border:1px solid rgba(91,220,255,.65);box-shadow:0 0 22px rgba(22,139,255,.25),inset 0 0 30px rgba(22,139,255,.13)}

.core:before,.core:after{content:"";position:absolute;border-radius:50%;inset:12px;border:1px dashed rgba(91,220,255,.45);animation:spin 18s linear infinite}.core:after{inset:25px;border:2px solid rgba(22,139,255,.25);border-left-color:var(--cyan);border-right-color:var(--cyan);animation:spin 9s linear infinite reverse}

.arc{position:absolute;inset:-8px;border-radius:50%;border:1px solid transparent;border-top-color:var(--cyan);border-bottom-color:rgba(22,139,255,.55);animation:spin 7s linear infinite}

.core button{position:relative;z-index:2;width:108px;height:108px;border-radius:50%;border:1px solid #69dfff;background:radial-gradient(circle,#164f78,#061a32 72%);color:#e5fbff;font-size:12px;letter-spacing:.16em;box-shadow:0 0 26px rgba(60,198,255,.35);cursor:pointer}

.core.listening button{background:radial-gradient(circle,#126c89,#061a32 72%);box-shadow:0 0 42px rgba(91,220,255,.8)}@keyframes spin{to{transform:rotate(360deg)}}

#state{font-size:11px;color:var(--cyan);letter-spacing:.16em;min-height:18px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(10,35,64,.86),rgba(4,14,29,.9));border-radius:14px;padding:15px;box-shadow:var(--glow);min-height:112px}

.panel h2{font-size:11px;letter-spacing:.16em;color:var(--cyan);margin:0 0 9px}.panel p{font-size:12px;color:#a9c7db;line-height:1.5;margin:0}.panel .big{font-size:20px;color:#eaf8ff;margin:6px 0}

.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}input{min-width:0;flex:1;background:#061326;border:1px solid var(--line);border-radius:10px;color:white;padding:13px;font-size:14px;outline:none}

button.action{background:linear-gradient(120deg,#07518a,#087eb1);border:1px solid #50cfff;color:white;border-radius:10px;padding:12px 15px;font-weight:650;cursor:pointer}

button.secondary{background:#0b1d32;border:1px solid var(--line);color:#bfeeff;border-radius:10px;padding:10px 12px;cursor:pointer}

.log{margin-top:15px;max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{border:1px solid rgba(91,220,255,.17);background:rgba(4,16,32,.7);padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5}.msg b{color:var(--cyan);display:block;font-size:10px;letter-spacing:.12em;margin-bottom:4px}

footer{text-align:center;color:#6588a4;font-size:10px;letter-spacing:.1em;padding:24px 8px calc(env(safe-area-inset-bottom) + 8px)}.note{border-left:2px solid #e7b95c;padding:9px 12px;color:#d9c99f;font-size:11px;line-height:1.5;margin-top:14px;background:rgba(70,48,10,.16)}

@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.core{width:170px;height:170px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.panel{min-height:auto}}

</style>

</head>
