<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#050b18">

<title>JARVIS | Centro de control</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#050b18;color:#d9f5ff;font-family:Arial,sans-serif;min-height:100vh;padding:18px}

header{text-align:center;padding:24px 8px}

h1{font-size:38px;letter-spacing:9px;color:#55dfff;text-shadow:0 0 20px #008cff;margin:10px}

.subtitle{color:#75bcd5;font-size:12px;letter-spacing:3px}

#clock{color:#55dfff;font-size:14px;margin-top:15px}

.panel{max-width:760px;margin:auto;border:1px solid #12628c;border-radius:18px;padding:16px;background:#071426;box-shadow:0 0 28px #0066aa33}

#state{text-align:center;color:#55dfff;font-size:12px;letter-spacing:2px;padding:12px}

#chat{height:48vh;min-height:280px;overflow-y:auto;padding:12px;border:1px solid #123b58;border-radius:12px;background:#030b16}

.msg{padding:12px;margin:9px 0;border-radius:10px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}

.user{background:#10324a;text-align:right;color:#b9eaff}

.jarvis{background:#09243a;border-left:3px solid #31cfff}

.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

input{flex:1;min-width:150px;background:#020b16;border:1px solid #17628a;border-radius:9px;padding:14px;color:white;font-size:16px}

button{background:#087eae;color:white;border:0;border-radius:9px;padding:12px 15px;font-weight:bold}

button.secondary{background:#12334b}

button:disabled{opacity:.5}

small{display:block;text-align:center;color:#6394aa;margin-top:12px}

</style>

</head>

<body>

<h1>JARVIS</h1>

<div class="subtitle">SISTEMA DE INTELIGENCIA PERSONAL</div>

<div id="clock"></div>

</header>

<div id="state">CONECTANDO CON JARVIS...</div>

<div id="chat" aria-live="polite"></div>

<div class="controls">

<input id="command" type="text" placeholder="Escribe una orden para JARVIS..." autocomplete="off">

<button id="send">ENVIAR</button>

</div>
